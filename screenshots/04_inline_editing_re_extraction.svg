<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16; font-family: system-ui, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#0d1322" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="35" fill="#f8fafc" font-weight="bold" font-size="16">Enquiry #6 Detail View — Human Edits &amp; AI Re-extraction Diff</text>

  <!-- AI Suggestions Callout Banner -->
  <g transform="translate(24, 75)">
    <rect x="0" y="0" width="1150" height="85" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="28" fill="#fcd34d" font-size="13" font-weight="bold">✨ RE-EXTRACTION COMPLETE — AI SUGGESTIONS AVAILABLE FOR HUMAN-EDITED FIELDS</text>
    <text x="20" y="50" fill="#fef3c7" font-size="11">Re-extraction preserved your human modification for [company], but generated a new AI recommendation:</text>

    <rect x="750" y="20" width="370" height="45" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="765" y="47" fill="#cbd5e1" font-size="12">AI Suggests Company: <tspan fill="#f8fafc" font-weight="bold">SpeedLogistics Inc.</tspan></text>
    <rect x="990" y="30" width="115" height="26" rx="5" fill="#f59e0b" fill-opacity="0.3"/>
    <text x="1000" y="47" fill="#fcd34d" font-size="10" font-weight="bold">Accept AI Suggestion</text>
  </g>

  <!-- Form Fields Grid -->
  <g transform="translate(24, 180)">
    <rect x="0" y="0" width="1150" height="460" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="0" width="1150" height="40" fill="#1e293b"/>
    <text x="20" y="25" fill="#94a3b8" font-size="11" font-weight="bold">FIELD EDIT TRACKING AUDIT</text>

    <!-- Company (Human Edited) -->
    <rect x="30" y="60" width="530" height="70" rx="8" fill="#1e293b"/>
    <text x="50" y="85" fill="#94a3b8" font-size="11">Company Name</text>
    <rect x="420" y="70" width="120" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="432" y="84" fill="#fcd34d" font-size="10" font-weight="bold">Edited by human</text>
    <text x="50" y="112" fill="#f8fafc" font-size="14" font-weight="bold">SpeedLogistics India (Corrected)</text>

    <!-- Contact Person -->
    <rect x="590" y="60" width="530" height="70" rx="8" fill="#1e293b"/>
    <text x="610" y="85" fill="#94a3b8" font-size="11">Contact Person</text>
    <text x="610" y="112" fill="#f8fafc" font-size="14">Rajesh Kumar</text>

    <!-- Budget -->
    <rect x="30" y="150" width="530" height="70" rx="8" fill="#1e293b"/>
    <text x="50" y="175" fill="#94a3b8" font-size="11">Budget (Raw / Normalized USD)</text>
    <text x="50" y="202" fill="#f8fafc" font-size="14" font-weight="bold">35-40 lakhs INR <tspan fill="#22d3ee" font-size="12">(≈ $45,181 USD)</tspan></text>

    <!-- Priority -->
    <rect x="590" y="150" width="530" height="70" rx="8" fill="#1e293b"/>
    <text x="610" y="175" fill="#94a3b8" font-size="11">Priority (Derived)</text>
    <rect x="610" y="185" width="80" height="24" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="625" y="201" fill="#fcd34d" font-size="12" font-weight="bold">MEDIUM</text>
  </g>
</svg>
