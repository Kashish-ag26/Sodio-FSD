<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16; font-family: system-ui, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#0d1322" stroke="#1e293b" stroke-width="1"/>
  <rect x="24" y="16" width="28" height="28" rx="8" fill="url(#grad1)"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <text x="64" y="35" fill="#f8fafc" font-weight="bold" font-size="16">Sodio Triage Console</text>
  <rect x="230" y="20" width="70" height="20" rx="10" fill="#6366f1" fill-opacity="0.15"/>
  <text x="242" y="34" fill="#818cf8" font-size="11" font-weight="bold">AI-Assisted</text>

  <!-- Status pills -->
  <rect x="940" y="18" width="110" height="24" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="955" y="34" fill="#34d399" font-size="11">● SQLite Active</text>
  <rect x="1060" y="18" width="115" height="24" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="1072" y="34" fill="#38bdf8" font-size="11">● Anthropic LLM</text>

  <!-- Stats Grid -->
  <g transform="translate(24, 80)">
    <rect x="0" y="0" width="270" height="85" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="30" fill="#94a3b8" font-size="11" font-weight="bold">TOTAL ENQUIRIES</text>
    <text x="20" y="65" fill="#f8fafc" font-size="28" font-weight="bold">21</text>

    <rect x="290" y="0" width="270" height="85" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="310" y="30" fill="#94a3b8" font-size="11" font-weight="bold">HIGH PRIORITY</text>
    <text x="310" y="65" fill="#fb7185" font-size="28" font-weight="bold">6</text>

    <rect x="580" y="0" width="270" height="85" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="600" y="30" fill="#94a3b8" font-size="11" font-weight="bold">GENUINE PROJECTS</text>
    <text x="600" y="65" fill="#34d399" font-size="28" font-weight="bold">16</text>

    <rect x="870" y="0" width="280" height="85" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="890" y="30" fill="#94a3b8" font-size="11" font-weight="bold">NORMALIZED PIPELINE</text>
    <text x="890" y="65" fill="#22d3ee" font-size="28" font-weight="bold">$1,245,000</text>
  </g>

  <!-- Toolbar & Filters -->
  <g transform="translate(24, 185)">
    <rect x="0" y="0" width="1150" height="50" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <rect x="15" y="10" width="300" height="30" rx="6" fill="#1e293b"/>
    <text x="30" y="30" fill="#64748b" font-size="12">🔍 Search company, contact, text...</text>

    <rect x="330" y="10" width="140" height="30" rx="6" fill="#1e293b"/>
    <text x="345" y="30" fill="#cbd5e1" font-size="12">All Service Lines ▾</text>

    <rect x="480" y="10" width="140" height="30" rx="6" fill="#1e293b"/>
    <text x="495" y="30" fill="#cbd5e1" font-size="12">All Priorities ▾</text>

    <rect x="630" y="10" width="140" height="30" rx="6" fill="#1e293b"/>
    <text x="645" y="30" fill="#cbd5e1" font-size="12">All Statuses ▾</text>

    <rect x="990" y="10" width="145" height="30" rx="6" fill="#4f46e5"/>
    <text x="1010" y="30" fill="#ffffff" font-size="12" font-weight="bold">+ Upload Batch</text>
  </g>

  <!-- Table -->
  <g transform="translate(24, 250)">
    <rect x="0" y="0" width="1150" height="400" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <!-- Table Header -->
    <rect x="0" y="0" width="1150" height="40" fill="#1e293b"/>
    <text x="40" y="25" fill="#94a3b8" font-size="11" font-weight="bold">COMPANY &amp; SENDER</text>
    <text x="320" y="25" fill="#94a3b8" font-size="11" font-weight="bold">SERVICE</text>
    <text x="480" y="25" fill="#94a3b8" font-size="11" font-weight="bold">BUDGET (RAW / EST USD)</text>
    <text x="730" y="25" fill="#94a3b8" font-size="11" font-weight="bold">TIMELINE</text>
    <text x="860" y="25" fill="#94a3b8" font-size="11" font-weight="bold">PRIORITY</text>
    <text x="980" y="25" fill="#94a3b8" font-size="11" font-weight="bold">STATUS</text>

    <!-- Row 1 -->
    <line x1="0" y1="90" x2="1150" y2="90" stroke="#1e293b"/>
    <text x="40" y="65" fill="#f8fafc" font-size="13" font-weight="bold">Apex AI Solutions (Marcus Vance)</text>
    <rect x="320" y="50" width="60" height="22" rx="4" fill="#a855f7" fill-opacity="0.2"/>
    <text x="340" y="65" fill="#c084fc" font-size="11" font-weight="bold">AI</text>
    <text x="480" y="65" fill="#e2e8f0" font-size="12">$75,000 USD</text>
    <text x="730" y="65" fill="#fb7185" font-size="12" font-weight="bold">ASAP</text>
    <rect x="860" y="50" width="65" height="22" rx="4" fill="#f43f5e" fill-opacity="0.2"/>
    <text x="875" y="65" fill="#fda4af" font-size="11" font-weight="bold">HIGH</text>
    <rect x="980" y="50" width="80" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="1000" y="65" fill="#60a5fa" font-size="11" font-weight="bold">New ▾</text>

    <!-- Row 2 -->
    <line x1="0" y1="140" x2="1150" y2="140" stroke="#1e293b"/>
    <text x="40" y="115" fill="#f8fafc" font-size="13" font-weight="bold">SpeedLogistics India (Rajesh Kumar)</text>
    <rect x="320" y="100" width="70" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="332" y="115" fill="#34d399" font-size="11" font-weight="bold">MOBILE</text>
    <text x="480" y="115" fill="#e2e8f0" font-size="12">35-40 lakhs (≈ $45,181)</text>
    <text x="730" y="115" fill="#cbd5e1" font-size="12">90 days</text>
    <rect x="860" y="100" width="75" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="872" y="115" fill="#fcd34d" font-size="11" font-weight="bold">MEDIUM</text>
    <rect x="980" y="100" width="80" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="990" y="115" fill="#34d399" font-size="11" font-weight="bold">Qualified ▾</text>

    <!-- Row 3 -->
    <line x1="0" y1="190" x2="1150" y2="190" stroke="#1e293b"/>
    <text x="40" y="165" fill="#fb7185" font-size="13" font-weight="bold">⚠️ SYSTEM NOTICE (Injection Attempt)</text>
    <rect x="320" y="150" width="65" height="22" rx="4" fill="#64748b" fill-opacity="0.2"/>
    <text x="333" y="165" fill="#94a3b8" font-size="11" font-weight="bold">OTHER</text>
    <text x="480" y="165" fill="#94a3b8" font-size="12">$10,000,000 (Blocked)</text>
    <text x="730" y="165" fill="#94a3b8" font-size="12">Immediate</text>
    <rect x="860" y="150" width="60" height="22" rx="4" fill="#64748b" fill-opacity="0.2"/>
    <text x="877" y="165" fill="#cbd5e1" font-size="11" font-weight="bold">LOW</text>
    <rect x="980" y="150" width="80" height="22" rx="4" fill="#64748b" fill-opacity="0.2"/>
    <text x="995" y="165" fill="#cbd5e1" font-size="11" font-weight="bold">Dropped ▾</text>
  </g>
</svg>
