<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16; font-family: system-ui, sans-serif;">
  <!-- Backdrop -->
  <rect x="0" y="0" width="1200" height="675" fill="#000000" fill-opacity="0.75"/>

  <!-- Modal Window -->
  <g transform="translate(300, 120)">
    <rect x="0" y="0" width="600" height="420" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="600" height="55" fill="#1e293b" rx="16"/>
    <text x="25" y="34" fill="#f8fafc" font-weight="bold" font-size="16">Upload Batch Enquiries File</text>

    <!-- File Dropzone -->
    <rect x="30" y="80" width="540" height="150" rx="12" fill="#020617" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6,6"/>
    <text x="220" y="140" fill="#818cf8" font-weight="bold" font-size="14">📁 sample-enquiries.txt</text>
    <text x="210" y="165" fill="#34d399" font-size="12">✓ 21 raw enquiry blocks detected (24.8 KB)</text>

    <!-- Progress Status Bar -->
    <g transform="translate(30, 250)">
      <rect x="0" y="0" width="540" height="70" rx="10" fill="#1e293b"/>
      <text x="20" y="30" fill="#f8fafc" font-size="13" font-weight="bold">Processing Bounded Concurrent Extraction (p-limit: 3)</text>
      <text x="20" y="52" fill="#94a3b8" font-size="11">Ingesting block 14 of 21... (13 successful, 0 failed)</text>

      <!-- Progress bar fill -->
      <rect x="320" y="38" width="200" height="12" rx="6" fill="#090d16"/>
      <rect x="320" y="38" width="135" height="12" rx="6" fill="#6366f1"/>
    </g>

    <!-- Footer Action -->
    <rect x="420" y="350" width="150" height="40" rx="8" fill="#6366f1"/>
    <text x="445" y="375" fill="#ffffff" font-weight="bold" font-size="13">Processing...</text>
  </g>
</svg>
